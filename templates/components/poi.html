<section class="poi-panel" id="poi-panel" aria-labelledby="poi-panel-title">
  <div class="poi-panel__heading">
    <div>
      <p class="location-kicker">TRAVEL FACILITIES</p>
      <h2 id="poi-panel-title">주변 편의시설</h2>
    </div>
  </div>
  <p id="poi-summary" class="poi-summary">
    목적지를 선택하면 주변 시설을 지도에서 확인할 수 있습니다.
  </p>
  <div id="poi-filters" class="poi-filters" role="group" aria-label="주변 시설 종류">
    <label class="poi-filter"><input id="poi-category-hospital" type="checkbox" value="hospital" checked><span>병원</span></label>
    <label class="poi-filter"><input id="poi-category-emergency" type="checkbox" value="emergency" checked><span>응급실</span></label>
    <label class="poi-filter"><input id="poi-category-convenience_store" type="checkbox" value="convenience_store" checked><span>편의점</span></label>
    <label class="poi-filter"><input id="poi-category-port" type="checkbox" value="port" checked><span>항구</span></label>
    <label class="poi-filter"><input id="poi-category-passenger_terminal" type="checkbox" value="passenger_terminal" checked><span>여객터미널</span></label>
    <label class="poi-filter"><input id="poi-category-fuel_station" type="checkbox" value="fuel_station" checked><span>주유소</span></label>
    <label class="poi-filter"><input id="poi-category-pharmacy" type="checkbox" value="pharmacy" checked><span>약국</span></label>
    <label class="poi-filter"><input id="poi-category-parking" type="checkbox" value="parking" checked><span>주차장</span></label>
    <label class="poi-filter"><input id="poi-category-ev_charger" type="checkbox" value="ev_charger" checked><span>EV 충전소</span></label>
  </div>
  <button id="poi-search" class="button button--poi" type="button" disabled>주변 시설 검색</button>
  <p id="poi-status" class="poi-status" role="status" aria-live="polite">목적지를 먼저 선택해 주세요.</p>
  <div id="poi-results" class="poi-results" aria-live="polite"></div>
</section>
