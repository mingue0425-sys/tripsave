name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KTO_TOLL_BROWSER_WARMUP: "0"
      KTO_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q backend app.py config.py

      - name: Run non-live tests
        run: pytest -m "not integration and not official and not live" -q

      - name: Check browser JavaScript syntax
        run: |
          node --check static/js/recommendations.js
          node --check static/js/trips.js
          node --test tests/test_recommendations_ui.js

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
